spring.application.name=spring-shopping
spring.datasource.url=jdbc:h2:file:./data/shopping;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-unknown-properties=true
shopping.profanity.url=https://www.purgomalum.com/service/containsprofanity
shopping.profanity.timeout=3s
